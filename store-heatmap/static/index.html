<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Heatmap</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e2e0db;
    --floor: #fbfaf7; --fixture: #d9d5cc; --accent: #c2410c; --accent-ink: #ffffff;
    --chip: #efede8; --focus: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1d1d20; --ink: #ececee; --muted: #9a9aa2; --line: #2e2e33;
      --floor: #18181b; --fixture: #3a3a40; --accent: #fb923c; --accent-ink: #1d1d1f;
      --chip: #26262b; --focus: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between;
           padding: 20px 24px 8px; }
  h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  .status { color: var(--muted); font-size: 13px; }
  .status b { color: var(--ink); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #16a34a; margin-right: 6px; }
  .dot.stale { background: #d97706; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 8px 24px 16px; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 11px; border-radius: 6px;
                font: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  label.ctl { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); }
  select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
           border-radius: 6px; padding: 4px 8px; }
  .scrub { display: flex; align-items: center; gap: 10px; flex: 1 1 320px; min-width: 240px; }
  .scrub input { flex: 1; accent-color: var(--accent); }
  .scrub output { font-variant-numeric: tabular-nums; min-width: 120px; color: var(--ink); }
  .play { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px;
          width: 32px; height: 28px; cursor: pointer; font: inherit; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 0 24px 24px; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
  @media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi .v { font-size: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; font-variant-numeric: tabular-nums; }
  .kpi .l { color: var(--muted); font-size: 12px; }

  .plan-wrap { position: relative; }
  canvas#plan { width: 100%; display: block; border-radius: 8px; }
  .legend { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--muted); font-size: 12px; }
  .legend .bar { flex: 0 0 160px; height: 8px; border-radius: 4px; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--panel); padding: 6px 9px;
         border-radius: 6px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -110%); display: none; }

  .list h2 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  .list .sub { color: var(--muted); font-size: 12px; margin: -6px 0 10px; }
  .row { display: grid; grid-template-columns: 34px 1fr auto; gap: 2px 10px; align-items: center;
         padding: 8px 6px; border-radius: 8px; cursor: pointer; }
  .row:hover, .row.sel { background: var(--chip); }
  .row .id { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .val { font-variant-numeric: tabular-nums; font-weight: 600; }
  .row .meter { grid-column: 2 / 4; height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; }
  .row .meter i { display: block; height: 100%; }
  .row svg { grid-column: 2 / 4; width: 100%; height: 26px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  footer { color: var(--muted); font-size: 12px; padding: 0 24px 24px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Store heatmap</h1>
  <div class="status" id="status">Loading…</div>
</header>

<div class="controls">
  <div class="seg" id="view" role="group" aria-label="View">
    <button data-v="aisle" aria-pressed="true">Aisle heat</button>
    <button data-v="flow" aria-pressed="false">Footfall heatmap</button>
  </div>
  <label class="ctl">Metric
    <select id="metric">
      <option value="visits">Visits</option>
      <option value="dwell_s">Total dwell time</option>
      <option value="avg_dwell_s">Avg dwell per visit</option>
      <option value="stop_rate">Stop rate (≥10 s)</option>
    </select>
  </label>
  <div class="seg" id="win" role="group" aria-label="Time window">
    <button data-w="900" aria-pressed="false">15 min</button>
    <button data-w="3600" aria-pressed="true">1 hour</button>
    <button data-w="10800" aria-pressed="false">3 hours</button>
    <button data-w="0" aria-pressed="false">All day</button>
  </div>
  <div class="scrub">
    <button class="play" id="play" aria-label="Play through the day">▶</button>
    <input type="range" id="scrub" min="0" max="0" step="900" aria-label="Window end time">
    <output id="when"></output>
  </div>
</div>

<main>
  <section class="card">
    <div class="kpis">
      <div class="kpi"><div class="v" id="k-shoppers">–</div><div class="l">Shoppers in window</div></div>
      <div class="kpi"><div class="v" id="k-hot">–</div><div class="l">Hottest aisle</div></div>
      <div class="kpi"><div class="v" id="k-cold">–</div><div class="l">Coldest aisle</div></div>
      <div class="kpi"><div class="v" id="k-dwell">–</div><div class="l">Avg dwell per aisle visit</div></div>
    </div>
    <div class="plan-wrap">
      <canvas id="plan" aria-label="Store floor plan heatmap"></canvas>
      <div class="tip" id="tip"></div>
    </div>
    <div class="legend"><span id="lg-lo">low</span><span class="bar" id="lg-bar"></span><span id="lg-hi">high</span></div>
  </section>
  <section class="card list">
    <h2>Aisles ranked</h2>
    <div class="sub" id="list-sub"></div>
    <div id="rows"></div>
  </section>
</main>
<footer>Positions are estimated from people's foot points on the camera image, projected onto the floor plan.
  No images or faces are stored.</footer>

<script>
const $ = (id) => document.getElementById(id);
const state = { layout: null, range: null, view: "aisle", metric: "visits", win: 3600, end: null,
                aisles: null, grid: null, series: null, selected: null, playing: null };

// Sequential heat ramp (light yellow -> orange -> deep red), ordered by lightness.
const RAMP = [[255, 245, 200], [254, 217, 118], [253, 174, 76], [240, 110, 50], [205, 50, 40], [140, 15, 40]];
function heat(t, alpha = 1) {
  t = Math.max(0, Math.min(1, t)) * (RAMP.length - 1);
  const i = Math.min(RAMP.length - 2, Math.floor(t)), f = t - i;
  const c = RAMP[i].map((v, k) => Math.round(v + (RAMP[i + 1][k] - v) * f));
  return `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
}
$("lg-bar").style.background = `linear-gradient(90deg, ${RAMP.map((_, i) => heat(i / (RAMP.length - 1))).join(",")})`;

const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmtTime = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const fmtDur = (s) => s >= 3600 ? `${(s / 3600).toFixed(1)} h` : s >= 60 ? `${Math.round(s / 60)} min` : `${Math.round(s)} s`;
function fmtMetric(m, v) {
  if (v == null) return "–";
  if (m === "visits") return v.toLocaleString();
  if (m === "stop_rate") return `${Math.round(v * 100)}%`;
  return fmtDur(v);
}
const api = (path, params = {}) =>
  fetch(`${path}?${new URLSearchParams(params)}`).then((r) => { if (!r.ok) throw new Error(r.statusText); return r.json(); });

// ---------- data ----------
function windowBounds() {
  const r = state.range;
  const end = state.end ?? r.end;
  const start = state.win ? Math.max(r.start, end - state.win) : r.start;
  return { start, end: (state.win ? end : r.end) + 1 };
}

async function loadRange() {
  state.range = await api("/api/range");
  const r = state.range;
  const s = $("scrub");
  if (r.start == null) { renderStatus(); return false; }
  const first = Math.ceil(r.start / 900) * 900, last = Math.ceil(r.end / 900) * 900;
  const atEnd = state.end == null || +s.value >= +s.max;
  s.min = first; s.max = last;
  if (atEnd) { state.end = r.end; s.value = last; }  // follow new data unless the user scrubbed back
  renderStatus();
  return true;
}

async function loadWindow() {
  const b = windowBounds();
  const [aisles, grid] = await Promise.all([api("/api/aisles", b), api("/api/grid", b)]);
  state.aisles = aisles; state.grid = grid;
  render();
}

async function loadSeries() {
  state.series = await api("/api/timeseries", { start: state.range.start, end: state.range.end + 1, bucket: 900 });
}

async function refresh() {
  try {
    if (!(await loadRange())) { render(); return; }
    await Promise.all([loadSeries(), loadWindow()]);
  } catch (e) { $("status").textContent = `Could not load data: ${e.message}`; }
}

// ---------- rendering ----------
function renderStatus() {
  const r = state.range;
  if (!r || r.start == null) { $("status").textContent = "No data yet — run the simulator or the camera worker."; return; }
  const lagMin = Math.max(0, Math.round((r.now - r.end) / 60));
  const stale = lagMin > 20;
  $("status").innerHTML = `<span class="dot${stale ? " stale" : ""}"></span>Data through <b>${fmtTime(r.end)}</b>` +
    ` · ${lagMin <= 1 ? "up to date" : `${lagMin} min behind`} · refreshes every minute`;
}

function metricValues() {
  const a = state.aisles?.aisles || {};
  return state.layout.aisles.map((x) => ({ ...x, m: a[x.id] || null, v: a[x.id]?.[state.metric] ?? 0 }));
}

let geom = null;
function render() {
  if (!state.layout) return;
  const L = state.layout, cv = $("plan"), ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, pad = 14;
  const s = (w - pad * 2) / L.width_m, h = L.depth_m * s + pad * 2;
  cv.width = w * dpr; cv.height = h * dpr; cv.style.height = `${h}px`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Floor y=0 is the store front (entrance), drawn at the bottom.
  const X = (x) => pad + x * s, Y = (y) => pad + (L.depth_m - y) * s;
  geom = { X, Y, s, pad };
  const path = (poly) => { ctx.beginPath(); poly.forEach(([x, y], i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, X(x), Y(y))); ctx.closePath(); };

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = css("--floor"); ctx.strokeStyle = css("--line"); ctx.lineWidth = 2;
  ctx.fillRect(X(0), Y(L.depth_m), L.width_m * s, L.depth_m * s);
  ctx.strokeRect(X(0), Y(L.depth_m), L.width_m * s, L.depth_m * s);

  const vals = metricValues(), max = Math.max(...vals.map((v) => v.v), 1e-9);

  if (state.view === "flow") drawFlow(ctx, L, X, Y, s, w, h);
  else vals.forEach((a) => { path(a.polygon); ctx.fillStyle = a.m ? heat(a.v / max, 0.9) : "transparent"; ctx.fill(); });

  ctx.fillStyle = css("--fixture");
  (L.fixtures || []).forEach((f) => { path(f); ctx.fill(); });

  // Aisle outlines + labels.
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  vals.forEach((a) => {
    path(a.polygon);
    const sel = state.selected === a.id;
    ctx.strokeStyle = sel ? css("--focus") : css("--muted"); ctx.lineWidth = sel ? 2.5 : 0.75;
    ctx.setLineDash(sel ? [] : [3, 3]); ctx.stroke(); ctx.setLineDash([]);
    const xs = a.polygon.map((p) => p[0]), ys = a.polygon.map((p) => p[1]);
    const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
    // Label colour follows the fill (fixed ramp), not the theme.
    ctx.fillStyle = state.view === "aisle" && a.m ? (a.v / max > 0.55 ? "#fff" : "#1d1d1f") : css("--ink");
    ctx.font = `600 ${Math.max(10, Math.min(13, s * 0.55))}px system-ui`;
    ctx.fillText(a.id, X(cx), Y(cy) - 8);
    ctx.font = `${Math.max(10, Math.min(12, s * 0.5))}px system-ui`;
    ctx.fillText(state.view === "aisle" ? fmtMetric(state.metric, a.m ? a.v : null) : "", X(cx), Y(cy) + 8);
  });

  if (L.entrance) {
    ctx.fillStyle = css("--accent"); ctx.font = "600 11px system-ui";
    ctx.fillText("▲ ENTRANCE", X(L.entrance[0]), Y(0) + 8 > h - 4 ? h - 6 : Y(0) - 8);
  }

  $("lg-lo").textContent = state.view === "flow" ? "less time" : fmtMetric(state.metric, 0);
  $("lg-hi").textContent = state.view === "flow" ? "more time" : fmtMetric(state.metric, max);
  renderKpis(vals);
  renderList(vals, max);
}

function drawFlow(ctx, L, X, Y, s, w, h) {
  const cells = state.grid?.cells || [];
  if (!cells.length) return;
  const c = state.grid.cell_m, max = Math.max(...cells.map((x) => x[2]));
  const dpr = window.devicePixelRatio || 1;
  const off = document.createElement("canvas"); off.width = w * dpr; off.height = h * dpr;
  const o = off.getContext("2d"); o.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = Math.max(10, c * s * 2.6);
  // Accumulate intensity as alpha, then colour it through the ramp.
  for (const [gx, gy, v] of cells) {
    const x = X((gx + 0.5) * c), y = Y((gy + 0.5) * c);
    const g = o.createRadialGradient(x, y, 0, x, y, r);
    const a = Math.min(1, Math.sqrt(v / max)) * 0.3;
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, "rgba(0,0,0,0)");
    o.fillStyle = g; o.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const img = o.getImageData(0, 0, off.width, off.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const a = d[i + 3] / 255;
    if (a < 0.02) { d[i + 3] = 0; continue; }
    const t = Math.min(1, a * 1.25);
    const col = heat(t).match(/\d+/g).map(Number);
    d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = Math.round(Math.min(1, 0.35 + t) * 235);
  }
  o.putImageData(img, 0, 0);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(off, 0, 0); ctx.restore();
}

function renderKpis(vals) {
  const a = state.aisles;
  $("k-shoppers").textContent = a ? a.shoppers.toLocaleString() : "–";
  const visited = vals.filter((v) => v.m);
  const byMetric = [...visited].sort((x, y) => y.v - x.v);
  $("k-hot").textContent = byMetric[0] ? byMetric[0].name : "–";
  $("k-cold").textContent = vals.length ? [...vals].sort((x, y) => x.v - y.v)[0].name : "–";
  const visits = visited.reduce((t, v) => t + v.m.visits, 0), dwell = visited.reduce((t, v) => t + v.m.dwell_s, 0);
  $("k-dwell").textContent = visits ? fmtDur(dwell / visits) : "–";
}

function renderList(vals, max) {
  const b = state.aisles ? windowBounds() : null;
  $("list-sub").textContent = b ? `${fmtTime(b.start)} – ${fmtTime(Math.min(b.end, state.range.end))} · by ${$("metric").selectedOptions[0].text.toLowerCase()} · sparkline = dwell through the day` : "";
  const rows = [...vals].sort((x, y) => y.v - x.v);
  if (!state.aisles) { $("rows").innerHTML = `<div class="empty">No data yet</div>`; return; }
  $("rows").innerHTML = rows.map((a) => `
    <div class="row${state.selected === a.id ? " sel" : ""}" data-id="${a.id}" tabindex="0">
      <span class="id">${a.id}</span><span class="name" title="${a.name}">${a.name}</span>
      <span class="val">${fmtMetric(state.metric, a.m ? a.v : null)}</span>
      <span class="meter"><i style="width:${(a.v / max) * 100}%;background:${heat(a.v / max)}"></i></span>
      ${spark(a.id)}
    </div>`).join("");
}

function spark(id) {
  const S = state.series; if (!S) return "";
  const v = S.series[id] || [], n = S.buckets, max = Math.max(...Object.values(S.series).flat(), 1);
  const W = 300, H = 26, bw = W / n;
  const b = windowBounds();
  const x0 = ((b.start - S.start) / S.bucket_s) * bw, x1 = ((Math.min(b.end, state.range.end) - S.start) / S.bucket_s) * bw;
  const bars = v.map((y, i) => `<rect x="${i * bw + 0.5}" y="${H - (y / max) * H}" width="${Math.max(1, bw - 1)}" height="${(y / max) * H}" fill="${heat(0.35 + 0.65 * y / max)}"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <rect x="${x0}" y="0" width="${Math.max(2, x1 - x0)}" height="${H}" fill="${css("--line")}" opacity=".7"/>${bars}</svg>`;
}

// ---------- interaction ----------
function setPressed(group, btn) { group.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b === btn)); }
$("view").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return;
  setPressed($("view"), b); state.view = b.dataset.v; render(); });
$("win").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return;
  setPressed($("win"), b); state.win = +b.dataset.w; updateWhen(); loadWindow(); });
$("metric").addEventListener("change", (e) => { state.metric = e.target.value; render(); });
$("scrub").addEventListener("input", (e) => {
  state.end = Math.min(+e.target.value, state.range.end); updateWhen(); loadWindow(); });
$("rows").addEventListener("click", (e) => { const r = e.target.closest(".row"); if (!r) return;
  state.selected = state.selected === r.dataset.id ? null : r.dataset.id; render(); });
$("rows").addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.closest(".row")?.click(); });

function updateWhen() {
  if (!state.range?.start) return;
  const b = windowBounds();
  $("when").textContent = state.win ? `${fmtTime(b.start)} – ${fmtTime(b.end)}` : "Whole day";
}

$("play").addEventListener("click", () => {
  const s = $("scrub");
  if (state.playing) { clearInterval(state.playing); state.playing = null; $("play").textContent = "▶"; return; }
  if (+s.value >= +s.max) s.value = s.min;
  if (!state.win) { setPressed($("win"), $("win").querySelector('[data-w="3600"]')); state.win = 3600; }
  $("play").textContent = "❚❚";
  state.playing = setInterval(() => {
    const next = +s.value + 900;
    if (next > +s.max) { $("play").click(); return; }
    s.value = next; state.end = Math.min(next, state.range.end); updateWhen(); loadWindow();
  }, 700);
});

const plan = $("plan"), tip = $("tip");
plan.addEventListener("mousemove", (e) => {
  if (!geom || !state.layout) return;
  const r = plan.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const x = (px - geom.pad) / geom.s, y = state.layout.depth_m - (py - geom.pad) / geom.s;
  const hit = metricValues().find((a) => inside(x, y, a.polygon));
  if (!hit) { tip.style.display = "none"; plan.style.cursor = ""; return; }
  const m = hit.m;
  tip.innerHTML = `<b>${hit.name}</b><br>${m ? `${m.visits} visits · ${fmtDur(m.dwell_s)} dwell · avg ${fmtDur(m.avg_dwell_s)} · ${Math.round(m.stop_rate * 100)}% stop` : "no visits in window"}`;
  tip.style.left = `${px}px`; tip.style.top = `${py}px`; tip.style.display = "block"; plan.style.cursor = "pointer";
});
plan.addEventListener("mouseleave", () => (tip.style.display = "none"));
plan.addEventListener("click", (e) => {
  const r = plan.getBoundingClientRect();
  const x = (e.clientX - r.left - geom.pad) / geom.s, y = state.layout.depth_m - (e.clientY - r.top - geom.pad) / geom.s;
  const hit = state.layout.aisles.find((a) => inside(x, y, a.polygon));
  state.selected = hit && state.selected !== hit.id ? hit.id : null; render();
});
function inside(x, y, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
  }
  return c;
}

window.addEventListener("resize", render);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);

(async () => {
  state.layout = await api("/api/layout");
  $("title").textContent = state.layout.name;
  document.title = `${state.layout.name} · Heatmap`;
  await refresh();
  updateWhen();
  setInterval(async () => { if (!state.playing) { await refresh(); updateWhen(); } }, 60_000);
})();
</script>
</body>
</html>
