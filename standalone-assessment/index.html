:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-sunken: #f2f2ef;
  --surface-hover: #f0efec;
  --ink: #0b0b0b;
  --ink-secondary: #52514e;
  --ink-muted: #898781;
  --line: #e1e0d9;
  --line-strong: #c3c2b7;
  --accent: #1c5cab;
  --accent-hover: #184f95;
  --accent-soft: #e8f0fb;
  --accent-ink: #ffffff;
  --series: #2a78d6;
  --good: #0ca30c;
  --critical: #d03b3b;
  /* categorical slots 2-4 (slot 1 is --series/--accent already) - fixed
   * order per the palette, used to give the always-4, always-together
   * summary tiles distinct accents. */

  --cat-3: #1baf7a;
  --cat-4: #eda100;
  /* Impact-vs-Feasibility quadrant colors. Blue is --series/--accent and
   * orange is --cat-2, reused as-is; green and red are new since neither
   * --good nor --critical (reserved status colors) may double as a
   * series identity. Green is the palette's pure-green categorical slot,
   * identical hex in both modes. */

  --quad-red: #e34948;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.05), 0 8px 24px rgba(11, 11, 11, 0.05);
  --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
}

    --surface: #1a1a19;
    --surface-sunken: #131312;
    --surface-hover: #242423;
    --ink: #ffffff;
    --ink-secondary: #c3c2b7;
    --ink-muted: #898781;
    --line: #2c2c2a;
    --line-strong: #383835;
    --accent: #3987e5;
    --accent-hover: #5598e7;
    --accent-soft: #172740;
    --accent-ink: #0b0b0b;
    --series: #3987e5;

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

}

.secondary-text { color: var(--ink-secondary); }
.small { font-size: 0.85rem; }
.eyebrow { font-size: 0.72rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-muted); font-weight: 600; }

/* tabs */
.tabs { display: flex; gap: 2px; }
.tabs button {
  border: none; background: transparent; color: var(--ink-secondary);

.tabs button[aria-current='true'] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* inputs */
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; font-weight: 500; color: var(--ink-secondary); }

input[type='text'], input[type='email'], input[type='date'], select, textarea {
  font: inherit; font-size: 0.92rem; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 9px 11px; width: 100%;
}
input:focus-visible, select:focus-visible, button:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
button { font: inherit; font-size: 0.9rem; font-weight: 500; border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 9px 16px; cursor: pointer; }
button:hover:not(:disabled) { background: var(--surface-hover); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
button.ghost { border-color: transparent; background: transparent; color: var(--ink-secondary); }
button.small { padding: 5px 10px; font-size: 0.8rem; }
button.link-button { border: none; background: none; padding: 0; font-size: 0.85rem; color: var(--accent); }
button.link-button:hover:not(:disabled) { background: none; text-decoration: underline; }
.form-grid { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-grid textarea { min-height: 60px; resize: vertical; }
select[multiple] { height: auto; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: var(--surface-sunken); border: 1px solid var(--line); font-size: 0.76rem; color: var(--ink-secondary); white-space: nowrap; }

.notice.error { border-color: color-mix(in srgb, var(--critical) 35%, transparent); background: color-mix(in srgb, var(--critical) 8%, transparent); color: var(--critical); }
.notice.success { border-color: color-mix(in srgb, var(--good) 35%, transparent); background: color-mix(in srgb, var(--good) 8%, transparent); color: var(--good); }
.empty { padding: 32px 20px; text-align: center; color: var(--ink-muted); }

/* stat tiles */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }

.stat .value { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ============================================================ helpers = */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const el = (tag, attrs, children) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') node.className = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) node.setAttribute(k, v);
    }
    for (const child of [].concat(children || [])) {
      if (child == null) continue;
      node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    }
    return node;
  };
  const fmt = (n, digits) => (n == null ? '-' : n.toFixed(digits == null ? 1 : digits));
  const round = (n, digits) => {
    if (n == null) return null;
    const f = Math.pow(10, digits == null ? 1 : digits);
    return Math.round(n * f) / f;

  const slugify = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  const timestampSlug = () => {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  };
  /** YYYYMMDD-HHMM (no seconds) - for the per-submission filename, kept
   * distinct from timestampSlug() above, which the Analyze Results CSV
   * exports still use. */
  const filenameStamp = () => {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
  };
  /** Strips only filesystem-illegal characters, keeping the text otherwise
   * human-readable (unlike slugify(), which lowercases and dash-joins
   * everything) - for filename segments built from free-typed fields. */
  const sanitizeFilenamePart = (s) => String(s || '').trim().replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, ' ');
  const median = (values) => {
    const v = values.filter((x) => x != null).sort((a, b) => a - b);
    if (v.length === 0) return null;
    const mid = Math.floor(v.length / 2);
    return v.length % 2 ? v[mid] : (v[mid - 1] + v[mid]) / 2;
  };
  const mean = (values) => {
    const v = values.filter((x) => x != null);
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
  };

  /* ================================================== scoring model ===== *
   * Mirrors the workbook exactly: for each category, a weighted mean of
   * (inverted ? 100-score : score), normalised by the weights actually
   * answered so a partial answer set still lands on 0-100. Overall is the
   * plain weighted sum of Impact and Feasibility, as currently defined on
   * the Weights sheet (Impact*0.6 + Feasibility*0.4) - not a geometric
   * mean. If that changes on the sheet, update `overallScore` below and
   * re-run build_config.py; nothing else needs to change.
   */
  function effectiveValue(factor, raw) {
    return factor.inverted ? 100 - raw : raw;
  }
  function categoryScore(factors, answers, category) {
    let weighted = 0;
    let weightSum = 0;
    for (const f of factors) {
      if (f.category !== category) continue;
      const raw = answers[f.key];
      if (raw == null || Number.isNaN(raw)) continue;
      weighted += effectiveValue(f, raw) * f.weight;
      weightSum += f.weight;
    }
    if (weightSum <= 0) return null;
    return weighted / weightSum;
  }
  function overallScore(impact, feasibility, overall) {
    if (impact == null || feasibility == null) return null;
    const wsum = overall.impactWeight + overall.feasibilityWeight;
    if (wsum <= 0) return null;
    return (impact * overall.impactWeight + feasibility * overall.feasibilityWeight) / wsum;
  }

      const parsed = JSON.parse(text);
      if (!Array.isArray(parsed.factors) || !Array.isArray(parsed.opportunities) || !parsed.overall) {
        throw new Error('File is missing factors/opportunities/overall - not a config.json this tool produced.');
      }
      CONFIG = parsed;
      renderDataSourceInfo();
      renderScoreView();
      renderCombineView();
      $('#data-source-details').open = false;
    } catch (err) {
      alert('Could not load that file: ' + err.message);
    } finally {
      e.target.value = '';
    }
  });

    CONFIG = DEFAULT_CONFIG;
    renderDataSourceInfo();
    renderScoreView();
    renderCombineView();

  /** Loads a previously saved response's .json (a single response, or an
   * array such as the accumulated file) into the form so it can be
   * reviewed or continued. Multiple matches prompt the facilitator to pick
   * which one, rather than guessing. */
  async function handleLoadRecordFile(file) {
    if (!file) return;
    const pickerBox = $('#load-record-picker');
    pickerBox.innerHTML = '';
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const records = Array.isArray(parsed) ? parsed : [parsed];
      const valid = records.filter((r) => r && r.opportunityId != null && r.scores);
      if (valid.length === 0) throw new Error('No recognisable response records found in that file.');
      if (valid.length === 1) {
        loadRecordIntoForm(valid[0]);
      } else {
        pickerBox.appendChild(el('p', { class: 'small secondary-text' }, `${valid.length} responses found - choose one to load:`));
        const list = el('div', { class: 'stack', style: 'gap: 4px;' });
        valid
          .slice()
          .reverse()
          .forEach((r) => {
            const when = r.submittedAt ? new Date(r.submittedAt).toLocaleString() : '';
            list.appendChild(
              el(
                'button',
                {
                  type: 'button',
                  class: 'small ghost',
                  style: 'justify-content: flex-start; text-align: left;',
                  onclick: () => {
                    loadRecordIntoForm(r);
                    pickerBox.innerHTML = '';
                  },
                },
                `${r.opportunityName || 'Untitled'} — ${r.businessOwnerName || 'unknown owner'}${when ? ` (${when})` : ''}`,
              ),
            );
          });
        pickerBox.appendChild(list);
      }
    } catch (err) {
      pickerBox.appendChild(el('div', { class: 'notice error' }, 'Could not load that file: ' + err.message));
    } finally {
      $('#load-record-file-input').value = '';
    }
  }

  function loadRecordIntoForm(record) {
    $('#f-facilitator-name').value = record.facilitatorName || '';
    $('#f-owner-name').value = record.businessOwnerName || '';
    $('#f-opportunity-owner').value = record.opportunityOwnerName || '';
    $('#f-executive-sponsor').value = record.executiveSponsorName || '';
    $('#f-owner-team').value = record.businessOwnerTeam || '';
    $('#f-other-stakeholders').value = record.otherStakeholders || '';
    const impactedSet = new Set(record.impactedBusinessFunctions || []);
    $$('#f-impacted-functions option').forEach((opt) => {
      opt.selected = impactedSet.has(opt.value);
    });

    const select = $('#f-opportunity');
    const catalogMatch =
      record.opportunityId != null
        ? CONFIG.opportunities.find((o) => o.id === record.opportunityId || o.name === record.opportunityName)
        : null;
    if (catalogMatch) {
      select.value = String(catalogMatch.id);
      currentOpportunity = catalogMatch;
      $('#opportunity-other-field').hidden = true;
      $('#f-opportunity-other-name').value = '';
    } else {
      select.value = 'other';
      currentOpportunity = {
        id: 'other',
        name: record.opportunityName || '',
        businessArea: record.businessArea || 'Other',
        businessGoal: record.businessGoal || '',
        relevantTeams: record.relevantTeams || [],
      };
      $('#opportunity-other-field').hidden = false;
      $('#f-opportunity-other-name').value = record.opportunityName || '';
    }

    $('#f-description').value = record.description || '';
    $('#f-out-of-scope').value = record.outOfScope || '';
    $('#opportunity-details-toggle').open = !!(record.description || record.outOfScope);

    currentAnswers = Object.assign({}, record.scores || {});
    currentComments = Object.assign({}, record.comments || {});

    renderOpportunityContext();
    renderFactorsCard();
    updateLiveScores();
    updateSubmitEnabled();
  }

  function renderFactorBlock(factor) {
    const block = el('div', { class: 'factor-block', 'data-key': factor.key });
    block.appendChild(el('div', { class: 'factor-head' }, [el('span', { class: 'name' }, factor.name)]));

    // The subtitle IS the toggle: expanding it reveals the rest of the
    // guiding questions for this factor, so there's one clickable prompt
    // per factor instead of a subtitle plus a separate disclosure.
    const subtitleBase = FACTOR_SUBTITLES[factor.key] ?? factor.question;
    const questions = INTERVIEW_QUESTIONS[factor.key] || [];
    const summaryParts = [subtitleBase, FACTOR_SUBTITLE_NOTES[factor.key]].filter(Boolean);
    const summaryText = summaryParts.length ? summaryParts.join(' — ') : questions.length ? `Guiding questions (${questions.length})` : '';
    if (summaryText) {
      if (questions.length) {
        block.appendChild(
          el('details', { class: 'guide-details' }, [
            el('summary', {}, summaryText),
            el(
              'ol',
              { class: 'guide-list' },
              questions.map((q) => el('li', {}, q)),
            ),
          ]),
        );
      } else {
        block.appendChild(el('div', { class: 'factor-question' }, summaryText));
      }
    }

    const scale = el('div', { class: 'scale', role: 'radiogroup', 'aria-label': factor.name + ' score' });
    factor.levels.forEach((level, levelIndex) => {
      const btn = el(
        'button',
        {
          type: 'button',
          class: 'scale-option',
          'aria-pressed': currentAnswers[factor.key] === level.score ? 'true' : 'false',
          onclick: () => {
            currentAnswers[factor.key] = level.score;
            $$('.scale-option', scale).forEach((b) => b.setAttribute('aria-pressed', 'false'));
            btn.setAttribute('aria-pressed', 'true');
            updateLiveScores();
            updateSubmitEnabled();
          },
        },
        [el('span', { class: 'score' }, scoreLabel(factor, levelIndex, level.score)), el('span', { class: 'desc' }, level.label)],
      );
      scale.appendChild(btn);
    });
    block.appendChild(scale);

    const commentInput = el('textarea', {
      class: 'factor-comment',
      rows: 2,
      placeholder: 'Additional Comments',
      'aria-label': factor.name + ' comments',
    });
    commentInput.value = currentComments[factor.key] || '';
    commentInput.addEventListener('input', () => {
      currentComments[factor.key] = commentInput.value;
    });
    block.appendChild(commentInput);

    return block;
  }

  function updateSubmitEnabled() {
    const btn = $('#submit-btn');
    if (!btn) return;
    const facilitatorName = $('#f-facilitator-name').value.trim();
    const ownerName = $('#f-owner-name').value.trim();
    const ownerTeam = $('#f-owner-team').value.trim();
    const answered = Object.keys(currentAnswers).length;
    const opportunityReady = currentOpportunity && (currentOpportunity.id !== 'other' || currentOpportunity.name);

  /* ================================================ direct file saving ==
   * Instead of downloading a new file per submission, keep ONE json and one
   * csv per laptop and append into them - via the File System Access API
   * (Chrome/Edge only; file:// pages do have access to it). Where it's not
   * available, or the user declines/cancels, every submission falls back to
   * exactly the old per-submission download so the tool always works.
   */
  const FSA_SUPPORTED = typeof window.showDirectoryPicker === 'function';
  const DIRECT_SAVE_JSON_NAME = 'ai_opportunity_assessments.json';
  const DIRECT_SAVE_CSV_NAME = 'ai_opportunity_assessments.csv';
  const FSA_DB_NAME = 'mk-ai-assessment-fsa-v1';
  const FSA_STORE_NAME = 'handles';
  const FSA_HANDLE_KEY = 'directory';

  let dirHandle = null;
  // 'unsupported' | 'unconnected' | 'connected' | 'reconnect' | 'blocked' | 'declined'
  let fileSyncMode = FSA_SUPPORTED ? 'unconnected' : 'unsupported';
  let fileSyncCount = null;
  let fileSyncLastSaved = null;
  let fileSyncError = null;

  function openFsaDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(FSA_DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(FSA_STORE_NAME);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function saveDirHandle(handle) {
    try {
      const db = await openFsaDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(FSA_STORE_NAME, 'readwrite');
        tx.objectStore(FSA_STORE_NAME).put(handle, FSA_HANDLE_KEY);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    } catch (e) {
      /* IndexedDB unavailable (e.g. private browsing) - direct save still
         works for the rest of this page load, it just won't be remembered
         after a reload. */
    }
  }
  async function loadDirHandle() {
    try {
      const db = await openFsaDb();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(FSA_STORE_NAME, 'readonly');
        const req = tx.objectStore(FSA_STORE_NAME).get(FSA_HANDLE_KEY);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    } catch (e) {
      return null;
    }
  }
  async function clearDirHandle() {
    try {
      const db = await openFsaDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(FSA_STORE_NAME, 'readwrite');
        tx.objectStore(FSA_STORE_NAME).delete(FSA_HANDLE_KEY);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    } catch (e) {
      /* nothing to do - handle just won't be found next time either */
    }
  }

  /** Empty text -> no records yet. Anything else must be a JSON array -
   * never guess/overwrite content this tool didn't write. */
  function parseExistingRecords(text) {
    const trimmed = (text || '').trim();
    if (!trimmed) return [];
    const parsed = JSON.parse(trimmed);
    if (!Array.isArray(parsed)) throw new Error('not an array');
    return parsed;
  }
  function appendRecord(existing, record) {
    return existing.concat([record]);
  }

  /**
   * Reads the current json file (creating it if absent), appends `record`,
   * writes the whole array back, then fully regenerates the csv from that
   * same array (never round-tripped/parsed back - a csv that's been opened
   * and resaved in Excel is not something to trust as a data source).
   * Read-then-parse happens entirely before any createWritable() call,
   * since a writable stream truncates the file the moment it's opened.
   */
  async function writeRecordToDirectory(handle, record) {
    const jsonHandle = await handle.getFileHandle(DIRECT_SAVE_JSON_NAME, { create: true });
    const existingText = await (await jsonHandle.getFile()).text();
    let existing;
    try {
      existing = parseExistingRecords(existingText);
    } catch (e) {
      throw new Error(
        `"${DIRECT_SAVE_JSON_NAME}" in this folder doesn't look like a file this tool created - choose a different folder to avoid overwriting it`,
      );
    }
    const all = appendRecord(existing, record);

    const jsonWritable = await jsonHandle.createWritable();
    await jsonWritable.write(JSON.stringify(all, null, 2));
    await jsonWritable.close();

    const csvHandle = await handle.getFileHandle(DIRECT_SAVE_CSV_NAME, { create: true });
    const csvWritable = await csvHandle.createWritable();
    await csvWritable.write('﻿' + buildCsv(all));
    await csvWritable.close();

    return all.length;
  }

  /** Peeks the connected folder's current record count without writing -
   * used right after connecting/reconnecting so the status line is accurate
   * even before this session's first submission. */
  async function refreshFileSyncCount() {
    if (!dirHandle) return;
    try {
      const jsonHandle = await dirHandle.getFileHandle(DIRECT_SAVE_JSON_NAME, { create: true });
      const text = await (await jsonHandle.getFile()).text();
      fileSyncCount = parseExistingRecords(text).length;
    } catch (e) {
      fileSyncCount = null;
    }
  }

  /** Opens the native folder picker - must be called as the first awaited
   * thing in a click handler, or Chromium won't honour the click's user
   * activation. Throws AbortError if the user cancels. */
  async function connectDirectory() {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    dirHandle = handle;
    fileSyncMode = 'connected';
    fileSyncError = null;
    await saveDirHandle(handle);
    await refreshFileSyncCount();
    return handle;
  }

  /** "Change folder…" / "Connect a folder" button handler - a genuine click
   * gesture of its own, independent of submit. */
  async function changeDirectory() {
    if (!FSA_SUPPORTED) return;
    try {
      await connectDirectory();
    } catch (e) {
      if (!(e && e.name === 'AbortError')) {
        fileSyncError = e && e.message ? e.message : 'Could not connect to that folder.';
      }
    }
    renderFileSyncStatus();
  }

  /** "Reconnect" button handler, for when permission needs reconfirming
   * (typically after a full browser restart). */
  async function reconnectDirectory() {
    if (!dirHandle) return;
    try {
      const permission = await dirHandle.requestPermission({ mode: 'readwrite' });
      if (permission === 'granted') {
        fileSyncMode = 'connected';
        fileSyncError = null;
        await refreshFileSyncCount();
      } else {
        dirHandle = null;
        fileSyncMode = 'unconnected';
        await clearDirHandle();
      }
    } catch (e) {
      dirHandle = null;
      fileSyncMode = 'unconnected';
    }
    renderFileSyncStatus();
  }

  /** Tries to silently resume a previously-connected folder at boot. Only
   * ever queries permission (no gesture needed) - never requests it, since
   * that needs a click; a real reconfirmation goes through the Reconnect
   * button instead. */
  async function tryRestoreDirHandle() {
    if (!FSA_SUPPORTED) return;
    const handle = await loadDirHandle();
    if (!handle) return;
    try {
      const permission = await handle.queryPermission({ mode: 'readwrite' });
      if (permission === 'granted') {
        dirHandle = handle;
        fileSyncMode = 'connected';
        await refreshFileSyncCount();
      } else if (permission === 'prompt') {
        dirHandle = handle;
        fileSyncMode = 'reconnect';
      } else {
        await clearDirHandle();
      }
    } catch (e) {
      /* leave fileSyncMode at its default ('unconnected') */
    }
    renderFileSyncStatus();
  }

  function buildFileSyncCard() {
    return el('div', { class: 'card', id: 'filesync-card' });
  }
  function renderFileSyncStatus() {
    const card = $('#filesync-card');
    if (!card) return;
    card.innerHTML = '';
    card.appendChild(el('div', { class: 'card-header' }, [el('h2', {}, 'Saved responses')]));

    if (fileSyncMode === 'unsupported') {
      card.appendChild(
        el(
          'p',
          { class: 'notice' },
          'Direct file saving isn’t available in this browser. Each submission downloads its own JSON and CSV file instead; Chrome or Edge can save directly into one running file.',
        ),
      );
      return;
    }

    if (fileSyncMode === 'connected') {
      const countText = fileSyncCount == null ? '' : ` · ${fileSyncCount} response${fileSyncCount === 1 ? '' : 's'} saved`;
      const savedText = fileSyncLastSaved ? ` · last saved ${fileSyncLastSaved.toLocaleTimeString()}` : '';
      card.appendChild(
        el('p', { class: 'small secondary-text' }, [
          'Saving directly to ',
          el('strong', {}, DIRECT_SAVE_JSON_NAME),
          ' in ',
          el('strong', {}, (dirHandle && dirHandle.name) || 'the connected folder'),
          countText + savedText,
        ]),
      );
      card.appendChild(el('button', { class: 'small ghost', onclick: changeDirectory }, 'Change folder…'));
      return;
    }

    if (fileSyncMode === 'reconnect') {
      card.appendChild(
        el(
          'p',
          { class: 'notice' },
          `Reconnect to "${(dirHandle && dirHandle.name) || 'your save folder'}" to keep appending to your existing file. Until then, submissions will download as separate files.`,
        ),
      );
      card.appendChild(el('button', { class: 'small primary', onclick: reconnectDirectory }, 'Reconnect'));
      return;
    }

    if (fileSyncMode === 'blocked') {
      card.appendChild(el('p', { class: 'notice error' }, fileSyncError || 'Could not save to the connected folder.'));
      card.appendChild(el('button', { class: 'small primary', onclick: changeDirectory }, 'Choose a different folder…'));
      return;
    }

    if (fileSyncMode === 'declined') {
      card.appendChild(
        el('p', { class: 'small muted' }, 'Each submission is downloading as its own file. Connect a folder to save everything into one file instead.'),
      );
      card.appendChild(el('button', { class: 'small', onclick: changeDirectory }, 'Connect a folder'));
      return;
    }

    // 'unconnected'
    card.appendChild(
      el(
        'p',
        { class: 'small muted' },
        'The first submission will ask you to choose (or create) a folder; every response after that saves straight into one file there.',
      ),
    );
    card.appendChild(el('button', { class: 'small', onclick: changeDirectory }, 'Connect a folder now (optional)'));
  }

  async function handleSubmit() {
    const impact = round(categoryScore(CONFIG.factors, currentAnswers, 'impact'), 1);
    const feasibility = round(categoryScore(CONFIG.factors, currentAnswers, 'feasibility'), 1);
    const overall = round(overallScore(impact, feasibility, CONFIG.overall), 1);

    // A custom "Other" opportunity has no catalog id - derive a stable one
    // from its name so repeat submissions of the same typed-in name group
    // together in Analyze Results, the same way catalog ids do.
    const isOtherOpportunity = currentOpportunity.id === 'other';
    const opportunityName = isOtherOpportunity ? $('#f-opportunity-other-name').value.trim() : currentOpportunity.name;
    const opportunityId = isOtherOpportunity ? `other-${slugify(opportunityName)}` : currentOpportunity.id;

    const record = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      submittedAt: new Date().toISOString(),
      facilitatorName: $('#f-facilitator-name').value.trim(),
      businessOwnerName: $('#f-owner-name').value.trim(),
      opportunityOwnerName: $('#f-opportunity-owner').value.trim(),
      executiveSponsorName: $('#f-executive-sponsor').value.trim(),
      otherStakeholders: $('#f-other-stakeholders').value.trim(),
      businessOwnerTeam: $('#f-owner-team').value.trim(),
      impactedBusinessFunctions: $$('#f-impacted-functions option')
        .filter((o) => o.selected)
        .map((o) => o.value),
      // Always the submission date - there's no date field for the
      // facilitator to fill in.
      interviewDate: new Date().toISOString().slice(0, 10),
      opportunityId: opportunityId,
      opportunityName: opportunityName,
      businessArea: currentOpportunity.businessArea,
      businessGoal: currentOpportunity.businessGoal,
      relevantTeams: currentOpportunity.relevantTeams,
      description: $('#f-description').value.trim(),
      outOfScope: $('#f-out-of-scope').value.trim(),
      scores: Object.assign({}, currentAnswers),
      comments: Object.assign({}, currentComments),
      impactScore: impact,
      feasibilityScore: feasibility,
      overallScore: overall,
      frameworkVersion: CONFIG.generatedFrom,
    };

    $('#submit-btn').disabled = true;

    // First-ever submit on a supported browser: this click IS the user
    // gesture, so the picker must be the very first thing awaited below -
    // nothing async may happen before it, or Chromium won't honour it.
    // Every submit after the first reuses the in-memory handle silently.
    if (FSA_SUPPORTED && !dirHandle && fileSyncMode === 'unconnected') {
      try {
        await connectDirectory();
      } catch (e) {
        // Cancelled or failed - don't re-prompt on every future click; the
        // status card offers a manual way back in.
        fileSyncMode = 'declined';
      }
    }

    let saved = false;
    if (dirHandle && fileSyncMode === 'connected') {
      try {
        fileSyncCount = await writeRecordToDirectory(dirHandle, record);
        fileSyncLastSaved = new Date();
        fileSyncError = null;
        saved = true;
      } catch (e) {
        // Never silently overwrite unrecognized content, and never retry
        // the same broken folder on every future submit.
        fileSyncError = e && e.message ? e.message : 'Could not save to the connected file.';
        fileSyncMode = 'blocked';
      }
    }

    const base = `${filenameStamp()}-${sanitizeFilenamePart(record.businessOwnerTeam)}-${sanitizeFilenamePart(opportunityName)}`;
    if (!saved) {
      // Fallback: unsupported browser, not connected, declined, or the
      // write above failed - a completed interview is never lost.
      downloadJson(record, base + '.json');
      downloadCsv(buildCsv([record]), base + '.csv');
    } else {
      // Even when the connected-folder save succeeds, also hand the
      // facilitator a standalone copy of just this response - a portable
      // per-opportunity file, on top of (not instead of) the running one.
      downloadJson(record, base + '.json');
    }

    renderFileSyncStatus();

    $('#submit-feedback').innerHTML = '';
    const noticeIsError = !saved && !!fileSyncError && fileSyncMode === 'blocked';
    const noticeText = saved
      ? `Saved "${opportunityName}" to ${DIRECT_SAVE_JSON_NAME} and downloaded a copy as JSON. Ready for the next interview.`
      : noticeIsError
        ? `Couldn’t save to the connected file (${fileSyncError}); downloaded "${opportunityName}" as a separate file instead.`
        : `Saved "${opportunityName}": JSON and CSV downloaded. Ready for the next interview.`;
    $('#submit-feedback').appendChild(el('span', { class: `notice ${noticeIsError ? 'error' : 'success'}` }, noticeText));

    // Move on to the next opportunity; keep facilitator details for the next interview.
    currentOpportunity = null;
    currentAnswers = {};
    currentComments = {};
    $('#f-opportunity').value = '';
    $('#f-owner-name').value = '';
    $('#f-opportunity-owner').value = '';
    $('#f-executive-sponsor').value = '';
    $('#f-other-stakeholders').value = '';
    $('#f-owner-team').value = '';
    $$('#f-impacted-functions option').forEach((opt) => { opt.selected = false; });
    $('#f-opportunity-other-name').value = '';
    $('#opportunity-other-field').hidden = true;
    $('#f-description').value = '';
    $('#f-out-of-scope').value = '';
    renderOpportunityContext();
    renderFactorsCard();
    updateLiveScores();
    updateSubmitEnabled();
  }

  function buildLoadCard() {
    const card = el('div', { class: 'card stack' });
    card.appendChild(el('h2', {}, 'Load submitted responses'));
    card.appendChild(el('p', { class: 'small muted' }, 'Load the .json files this tool downloads on submit (not the .csv - that’s for opening directly in Excel, not for re-importing here).'));

    const fileInput = el('input', { type: 'file', accept: 'application/json', multiple: true, id: 'combine-file-input' });
    const zone = el(
      'div',
      { class: 'dropzone', onclick: () => fileInput.click() },
      ['Drop exported .json files here, or click to browse', fileInput],
    );
    ['dragover', 'dragenter'].forEach((evt) =>
      zone.addEventListener(evt, (e) => {
        e.preventDefault();
        zone.classList.add('dragover');
      }),
    );
    ['dragleave', 'dragend'].forEach((evt) => zone.addEventListener(evt, () => zone.classList.remove('dragover')));
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    card.appendChild(zone);

    card.appendChild(el('div', { id: 'combine-load-errors' }));
    return card;
  }

  async function handleFiles(fileList) {
    const errors = [];
    for (const file of Array.from(fileList)) {
      if (!/\.json$/i.test(file.name)) {
        errors.push(`${file.name}: skipped (only .json files can be loaded here)`);
        continue;
      }
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        const records = Array.isArray(parsed) ? parsed : [parsed];
        const valid = records.filter((r) => r && r.opportunityId != null && r.scores);
        if (valid.length === 0) throw new Error('no recognisable submission records found');
        combinedFiles.push({ name: file.name, records: valid });
      } catch (err) {
        errors.push(`${file.name}: ${err.message}`);
      }
    }
    const errBox = $('#combine-load-errors');
    errBox.innerHTML = '';
    if (errors.length) {
      errBox.appendChild(el('div', { class: 'notice error' }, errors.join(' · ')));
    }
    renderCombineDerived();
  }

  function allCombinedRecords() {
    const byId = new Map();
    for (const f of combinedFiles) for (const r of f.records) byId.set(r.id || JSON.stringify(r), r);
    return Array.from(byId.values());
  }

  function sortRecords(records, state) {
    const dir = state.dir === 'asc' ? 1 : -1;
    return records.slice().sort((a, b) => {
      const av = a[state.field];
      const bv = b[state.field];
      if (typeof av === 'string' || typeof bv === 'string') return String(av).localeCompare(String(bv)) * dir;
      if (av == null) return 1;
      if (bv == null) return -1;
      return (av - bv) * dir;
    });
  }

  function summarise(records) {
    const byOpp = new Map();
    for (const r of records) {
      if (!byOpp.has(r.opportunityId)) {
        byOpp.set(r.opportunityId, {
          opportunityId: r.opportunityId,
          opportunityName: r.opportunityName,
          businessArea: r.businessArea,
          items: [],
        });
      }
      byOpp.get(r.opportunityId).items.push(r);
    }
    return Array.from(byOpp.values()).map((group) => ({
      opportunityId: group.opportunityId,
      opportunityName: group.opportunityName,
      businessArea: group.businessArea,
      count: group.items.length,
      impactScore: round(mean(group.items.map((i) => i.impactScore)), 1),
      feasibilityScore: round(mean(group.items.map((i) => i.feasibilityScore)), 1),
      overallScore: round(mean(group.items.map((i) => i.overallScore)), 1),
    }));
  }

  /* ---------------------------------------------------------- scatter -- */
  const VB_W = 780;
  const VB_H = 560;
  const PAD = { top: 24, right: 24, bottom: 48, left: 56 };
  const PLOT_W = VB_W - PAD.left - PAD.right;
  const PLOT_H = VB_H - PAD.top - PAD.bottom;
  const TICKS = [0, 25, 50, 75, 100];

  function buildChartCard() {
    const card = el('div', { class: 'card', id: 'chart-card' });
    return card;
  }
  function renderChart() {
    const card = $('#chart-card');
    if (!card) return;
    const summary = summarise(allCombinedRecords()).filter((s) => s.impactScore != null && s.feasibilityScore != null);
    card.innerHTML = '';
    card.appendChild(el('h2', {}, 'Impact vs Feasibility'));
    card.appendChild(el('p', { class: 'small muted', style: 'margin-top: 2px;' }, 'One mark per AI opportunity, placed by the mean of its loaded responses. Quadrant lines sit at the median of what’s plotted, not a fixed midpoint.'));

    if (summary.length === 0) {
      card.appendChild(el('p', { class: 'empty' }, 'Load responses above to see the map.'));
      return;
    }

    const midX = median(summary.map((s) => s.feasibilityScore));
    const midY = median(summary.map((s) => s.impactScore));
    const toX = (v) => PAD.left + (v / 100) * PLOT_W;
    const toY = (v) => PAD.top + (1 - v / 100) * PLOT_H;
    const radius = (count) => Math.min(20, 6 + Math.sqrt(Math.max(count, 1) - 1) * 4);
    // Colors each dot by which quadrant it falls in (split at the same
    // median lines drawn below, so color and position never disagree):
    // high impact + high feasibility = green, high impact + low
    // feasibility = blue, low impact + high feasibility = orange, low
    // impact + low feasibility = red. Shade (opacity) then layers in the
    // mean Overall Score within that quadrant - deeper = higher.
    const quadrantColor = (impact, feasibility) => {
      const highImpact = (impact ?? 0) >= midY;
      const highFeasibility = (feasibility ?? 0) >= midX;
      if (highImpact && highFeasibility) return 'var(--quad-green)';
      if (highImpact && !highFeasibility) return 'var(--series)';
      if (!highImpact && highFeasibility) return 'var(--cat-2)';
      return 'var(--quad-red)';
    };
    const scoreOpacity = (score) => {
      const s = score == null ? 0 : score;
      if (s >= 80) return 1;
      if (s >= 60) return 0.9;
      if (s >= 40) return 0.75;
      if (s >= 20) return 0.6;
      return 0.45;
    };

    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${VB_W} ${VB_H}`);
    svg.setAttribute('class', 'chart-surface');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', `Impact vs feasibility for ${summary.length} AI opportunities`);
    const svgEl = (tag, attrs) => {
      const n = document.createElementNS(svgNS, tag);
      for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
      return n;
    };

    // gridlines + ticks
    for (const t of TICKS) {
      const x = toX(t);
      const y = toY(t);
      svg.appendChild(svgEl('line', { x1: x, y1: PAD.top, x2: x, y2: PAD.top + PLOT_H, stroke: 'var(--line)', 'stroke-width': 1 }));
      svg.appendChild(svgEl('line', { x1: PAD.left, y1: y, x2: PAD.left + PLOT_W, y2: y, stroke: 'var(--line)', 'stroke-width': 1 }));
      const xt = svgEl('text', { x, y: PAD.top + PLOT_H + 20, 'text-anchor': 'middle', class: 'axis-tick' });
      xt.textContent = t;
      svg.appendChild(xt);
      const yt = svgEl('text', { x: PAD.left - 10, y: y + 4, 'text-anchor': 'end', class: 'axis-tick' });
      yt.textContent = t;
      svg.appendChild(yt);
    }
    // quadrant lines (median-based)
    svg.appendChild(svgEl('line', { x1: toX(midX), y1: PAD.top, x2: toX(midX), y2: PAD.top + PLOT_H, stroke: 'var(--line-strong)', 'stroke-width': 1, 'stroke-dasharray': '4 4' }));
    svg.appendChild(svgEl('line', { x1: PAD.left, y1: toY(midY), x2: PAD.left + PLOT_W, y2: toY(midY), stroke: 'var(--line-strong)', 'stroke-width': 1, 'stroke-dasharray': '4 4' }));
    // axes
    svg.appendChild(svgEl('line', { x1: PAD.left, y1: PAD.top + PLOT_H, x2: PAD.left + PLOT_W, y2: PAD.top + PLOT_H, stroke: 'var(--line-strong)', 'stroke-width': 1 }));
    svg.appendChild(svgEl('line', { x1: PAD.left, y1: PAD.top, x2: PAD.left, y2: PAD.top + PLOT_H, stroke: 'var(--line-strong)', 'stroke-width': 1 }));
    const xTitle = svgEl('text', { x: PAD.left + PLOT_W / 2, y: VB_H - 8, 'text-anchor': 'middle', class: 'axis-title' });
    xTitle.textContent = 'Feasibility score →';
    svg.appendChild(xTitle);
    const yTitle = svgEl('text', { x: 14, y: PAD.top + PLOT_H / 2, 'text-anchor': 'middle', class: 'axis-title', transform: `rotate(-90 14 ${PAD.top + PLOT_H / 2})` });
    yTitle.textContent = 'Impact score →';
    svg.appendChild(yTitle);

    // marks, largest first so a single-response point never gets buried
    const points = summary
      .map((s) => ({ ...s, x: toX(s.feasibilityScore), y: toY(s.impactScore), r: radius(s.count) }))
      .sort((a, b) => b.r - a.r);
    for (const p of points) {
      const g = svgEl('g', {});
      const circle = svgEl('circle', { cx: p.x, cy: p.y, r: p.r, fill: quadrantColor(p.impactScore, p.feasibilityScore), 'fill-opacity': scoreOpacity(p.overallScore), stroke: 'var(--surface)', 'stroke-width': 2 });
      const title = svgEl('title', {});
      title.textContent = `${p.opportunityName}: Impact ${fmt(p.impactScore)}, Feasibility ${fmt(p.feasibilityScore)}, Overall ${fmt(p.overallScore)}, ${p.count} response(s)`;
      circle.appendChild(title);
      g.appendChild(circle);
      svg.appendChild(g);
    }
    // Label the highest-scoring points, skipping any whose point sits too
    // close (in pixels) to an already-placed one - two opportunities that
    // score identically land on the exact same pixel and would otherwise
    // draw overlapping, unreadable text. Every point still has its exact
    // numbers on hover via <title> regardless of whether it's labelled.
    const candidates = summary.slice().sort((a, b) => (b.overallScore || 0) - (a.overallScore || 0));
    const placed = [];
    const labelled = new Set();
    for (const s of candidates) {
      if (labelled.size >= 8) break;
      const px = toX(s.feasibilityScore);
      const py = toY(s.impactScore);
      if (placed.some((q) => Math.abs(q.x - px) < 110 && Math.abs(q.y - py) < 22)) continue;
      placed.push({ x: px, y: py });
      labelled.add(s.opportunityId);
    }
    for (const p of points) {
      if (!labelled.has(p.opportunityId)) continue;
      const flip = p.x > PAD.left + PLOT_W * 0.72;
      const t = svgEl('text', { x: flip ? p.x - p.r - 6 : p.x + p.r + 6, y: p.y + 4, 'text-anchor': flip ? 'end' : 'start', class: 'point-label' });
      t.textContent = p.opportunityName;
      svg.appendChild(t);
    }

    card.appendChild(svg);
    const quadrantLegendItems = [
      { color: 'var(--quad-green)', label: 'High Impact, High Feasibility' },
      { color: 'var(--series)', label: 'High Impact, Low Feasibility' },
      { color: 'var(--cat-2)', label: 'Low Impact, High Feasibility' },
      { color: 'var(--quad-red)', label: 'Low Impact, Low Feasibility' },
    ];
    card.appendChild(
      el(
        'div',
        { class: 'chart-legend' },
        quadrantLegendItems.map((item) =>
          el('span', { class: 'legend-item' }, [el('span', { class: 'swatch', style: `background: ${item.color};` }), item.label]),
        ),
      ),
    );
  }

  function renderCombineDerived() {
    renderCombineStats();
    renderCombinedTable();
    renderSummaryTable();
    renderChart();
  }
  function renderCombineView() {
    buildCombineView();
    renderCombineDerived();
  }

  /* =============================================================== boot = */
  renderDataSourceInfo();
  renderScoreView();
  renderCombineView();
  void tryRestoreDirHandle();
})();
</script>
</body>
</html>
